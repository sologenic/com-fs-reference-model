syntax = "proto3";

package reference;

import "google/protobuf/Empty.proto";
import "reference.proto";

option go_package = "github.com/sologenic/com-fs-reference-model;reference";

service ReferenceService {
    // Store a single value
    rpc Upsert(Reference) returns (google.protobuf.Empty) {}

    rpc Delete(ID) returns (google.protobuf.Empty) {}

    rpc Get(SelectOptions) returns (References) {}
    rpc GetByID(ReferenceID) returns (Reference) {}

    // Count references for a given account and type
    rpc CountReferences(CountOption) returns (Counts) {}

    // Count references for a given type, key and period
    rpc ReferenceStatsByPeriod(StatsOption) returns (Counts) {}
}